# バリデーションメッセージ定義
jakarta.validation.constraints.NotNull.message={0}は必須項目です。
jakarta.validation.constraints.Max.message={0}は{1}以下で入力してください。
jakarta.validation.constraints.Min.message={0}は{1}以上で入力してください。
jp.brainjuice.pokego.web.validation.InRange.message={0}は{min}〜{max}の範囲で指定してください。
typeMismatch={0}の入力形式が不正です。

iva=個体値
