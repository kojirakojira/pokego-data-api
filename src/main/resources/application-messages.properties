type1=タイプ1
type2=タイプ2
defenderType1=タイプ1
defenderType2=タイプ2
weather=天候
wbFlg=天候ブースト
mega=メガシンカ
megaSelected=メガシンカ
shadow=シャドウ
shadowSelected=シャドウ
order=並び順